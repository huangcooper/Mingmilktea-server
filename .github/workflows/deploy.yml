# ==============================================================
# 奶茶原材料管理系统 — CI/CD 自动部署
# 触发：push 到 main 分支
# 流程：checkout → Tailscale 联网 → tar+ssh 同步到物理机 → docker 重建
#
# 只需配 1 个 Secret：
#   GitHub → Settings → Secrets and variables → Actions → New secret
#   名称: TAILSCALE_AUTHKEY
#   值:   从 https://login.tailscale.com/admin/settings/keys 生成
#         (勾选 Reusable + Ephemeral=No)
# ==============================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 连接 Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: 同步代码并重建容器
        run: |
          set -e
          HOST="100.114.225.7"
          echo "=== 上传代码到 $HOST ==="
          
          # tar 管道同步（排除 git/.db/缓存）
          tar czf - \
            --exclude='.git' \
            --exclude='milk_tea.db' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            . | ssh -o StrictHostKeyChecking=no root@$HOST \
              "cd /srv/remote-test/apps/milktea && tar xzf -"
          
          echo "=== 重建 Docker 容器 ==="
          ssh -o StrictHostKeyChecking=no root@$HOST "
            cd /srv/remote-test/apps/milktea
            docker stop rt-milktea 2>/dev/null || true
            docker rm rt-milktea 2>/dev/null || true
            docker run -d \
              --name rt-milktea \
              --network remote-test_default \
              --network-alias milktea \
              --restart unless-stopped \
              -e DATABASE_URL=postgresql+pg8000://milktea:milktea@db:5432/milktea \
              -v /srv/remote-test/apps/milktea:/app \
              python:3.12-slim \
              bash -c 'pip install --no-cache-dir -r /app/requirements.txt && exec python /app/backend/main.py'
            
            sleep 5
            STATUS=\$(docker inspect -f '{{.State.Status}}' rt-milktea)
            echo \"容器状态: \$STATUS\"
            docker logs --tail 5 rt-milktea
          "
          
          echo "=== 部署完成 ==="
