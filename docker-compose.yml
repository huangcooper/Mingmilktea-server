# 本地开发环境：PostgreSQL + FastAPI 双容器
# 启动: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f app
# 仅用 SQLite 本地调试时无需此文件，直接 python backend/main.py

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: milktea
      POSTGRES_USER: milktea
      POSTGRES_PASSWORD: milktea
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milktea -d milktea"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://milktea:milktea@db:5432/milktea
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./static:/app/static

volumes:
  pgdata:
